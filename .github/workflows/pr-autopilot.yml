name: PR Autopilot

# Claude reviews every new or updated PR from the team, merges it once the
# required checks pass, resolves merge conflicts on an integration branch, and
# runs any new Supabase migrations with the Supabase CLI. The rules it follows
# live in .github/claude/pr-autopilot.md.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (or set ANTHROPIC_API_KEY)
#   AUTOPILOT_GH_TOKEN       a token from a repo admin with Contents, Pull
#                            requests and Workflows read/write. The built-in
#                            GITHUB_TOKEN can't admin-merge past branch
#                            protection or push branches that trigger checks.
#   SUPABASE_ACCESS_TOKEN    Supabase personal access token (Account -> Access
#                            Tokens) for running migrations.
#   SUPABASE_DB_PASSWORD     optional; only if `supabase link` asks for it.
# Until the first three exist, every run stops at the "Check setup" step.
#
# SECURITY. pull_request_target runs with secrets, so this job never checks
# out, installs or executes code from a PR: it runs from main, and Claude only
# reads PR diffs and edits files. Only PRs opened by ALLOWED_AUTHORS are
# processed, because a PR's text reaches an agent that holds an admin token
# and database access.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  # Sweep for anything a queued run missed: GitHub keeps only one pending run
  # per concurrency group, so a burst of PRs can drop some events.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to process (blank = every eligible open PR)
        required: false

# One run at a time: two agents merging and migrating at once would race.
concurrency:
  group: pr-autopilot
  cancel-in-progress: false

permissions:
  contents: read

env:
  ALLOWED_AUTHORS: designedbyalok KetanPatni02 sharmadevanshi147
  SUPABASE_PROJECT_REF: osnihfqqrcchsaqhagcx

jobs:
  autopilot:
    name: Review, merge and migrate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check setup
        id: setup
        env:
          HAS_GH: ${{ secrets.AUTOPILOT_GH_TOKEN != '' }}
          HAS_SUPABASE: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_GH" = true ] && [ "$HAS_SUPABASE" = true ] && [ "$HAS_CLAUDE" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR Autopilot is not set up yet (missing secrets). Skipping."
          fi

      - name: Find eligible PRs
        id: eligible
        if: steps.setup.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOPILOT_GH_TOKEN }}
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_HEAD: ${{ github.event.pull_request.head.ref }}
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          allowed() { case " $ALLOWED_AUTHORS " in *" $1 "*) return 0;; esac; return 1; }

          # A PR event from someone outside the list never starts Claude.
          if [ "$EVENT" = pull_request_target ]; then
            if ! allowed "$EVENT_AUTHOR"; then
              echo "::notice::PR #$EVENT_PR is by $EVENT_AUTHOR, not an allowed author. Skipping."
              echo "prs=" >> "$GITHUB_OUTPUT"; exit 0
            fi
            case "$EVENT_HEAD" in autopilot/*)
              echo "::notice::PR #$EVENT_PR is an autopilot branch. Skipping."
              echo "prs=" >> "$GITHUB_OUTPUT"; exit 0;;
            esac
            # New commits are a new attempt: clear an earlier hold.
            if [ "$EVENT_ACTION" = synchronize ] || [ "$EVENT_ACTION" = reopened ]; then
              gh pr edit "$EVENT_PR" --repo "$GITHUB_REPOSITORY" --remove-label autopilot:needs-human >/dev/null 2>&1 || true
            fi
          fi

          # Eligible: open, not a draft, by an allowed author, not an autopilot
          # branch, not titled wip, not labelled autopilot:skip or
          # autopilot:needs-human.
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --limit 50 \
                  --json number,author,headRefName,isDraft,title,labels \
            | jq -r --arg allowed "$ALLOWED_AUTHORS" '
                ($allowed | split(" ")) as $ok
                | map(select(
                    (.isDraft | not)
                    and (.author.login as $a | $ok | index($a))
                    and (.headRefName | startswith("autopilot/") | not)
                    and (.title | test("^\\s*\\[?wip\\b"; "i") | not)
                    and ([.labels[].name] | index("autopilot:skip") | not)
                    and ([.labels[].name] | index("autopilot:needs-human") | not)))
                | sort_by(.number) | map(.number) | join(" ")')

          if [ -n "$INPUT_PR" ]; then
            case " $prs " in *" $INPUT_PR "*) prs="$INPUT_PR";; *)
              echo "::notice::PR #$INPUT_PR is not eligible."; prs="";;
            esac
          fi
          echo "Eligible PRs: ${prs:-none}"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        if: steps.eligible.outputs.prs != ''
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AUTOPILOT_GH_TOKEN }}

      - name: Setup Supabase CLI
        if: steps.eligible.outputs.prs != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: steps.eligible.outputs.prs != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Run Claude
        if: steps.eligible.outputs.prs != ''
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.AUTOPILOT_GH_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AUTOPILOT_GH_TOKEN }}
          # The eligibility step already limits authors; this lets the action
          # accept PR events from contributors who work from forks.
          allowed_non_write_users: KetanPatni02,sharmadevanshi147
          prompt: |
            You are the PR autopilot for ${{ github.repository }}.
            Read .github/claude/pr-autopilot.md and follow it exactly.

            Trigger: ${{ github.event_name }}
            Triggering PR: ${{ github.event.pull_request.number || inputs.pr || 'none (sweep)' }}
            Eligible open PRs, oldest first: ${{ steps.eligible.outputs.prs }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 400
            --allowedTools Bash,Read,Edit,Write,Glob,Grep
          settings: |
            {
              "permissions": {
                "deny": [
                  "Bash(supabase config push:*)",
                  "Bash(supabase db push:*)",
                  "Bash(supabase db reset:*)",
                  "Bash(supabase link:*)",
                  "Bash(bun run seed:*)",
                  "Bash(bun install:*)",
                  "Bash(bun run:*)",
                  "Bash(npm:*)",
                  "Bash(npx:*)",
                  "Bash(pnpm:*)",
                  "Bash(bunx:*)",
                  "Bash(git push --force:*)",
                  "Bash(git push -f:*)",
                  "Bash(gh secret:*)",
                  "Bash(gh repo:*)"
                ]
              }
            }
